[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wallapop-mcp"
dynamic = ["version"]
description = "MCP server for Wallapop: search, deals, offers, chat, saved searches and listing management for AI agents. Also ships a CLI and a typed Python client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "figurophobia" }]
maintainers = [{ name = "jrrome" }]
keywords = ["wallapop", "mcp", "model-context-protocol", "ai-agents", "api", "client", "cli", "offers", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["mcp>=2"]

[project.scripts]
wallapop-mcp = "wallapop_mcp.mcp_server:main"
wallapop = "wallapop_mcp.cli.main:main"

[project.optional-dependencies]
browser = ["playwright"]
test = ["pytest>=8"]
build = ["build", "twine", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/figurophobia/wallapop-mcp"
Repository = "https://github.com/figurophobia/wallapop-mcp"
Issues = "https://github.com/figurophobia/wallapop-mcp/issues"
Documentation = "https://github.com/figurophobia/wallapop-mcp/blob/main/AGENTS.md"

[tool.hatch.version]
path = "wallapop_mcp/config.py"

[tool.hatch.build.targets.wheel]
packages = ["wallapop_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "wallapop_mcp",
    "tests",
    "docs",
    "packaging",
    "scripts",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "CREDITS.md",
    "LICENSE",
    "README.md",
]
exclude = ["**/__pycache__", "cookies.txt", "credentials.json", "session.json", ".env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
