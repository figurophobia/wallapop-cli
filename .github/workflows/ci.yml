name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Verify build has no secrets
        run: |
          python -m pip install --quiet build
          python -m build
          if find dist -name '*.whl' -exec unzip -l {} \; | grep -E 'cookies\.txt|credentials\.json|session\.json'; then
            echo "secrets packaged!"; exit 1
          fi
          echo "no secrets in wheel"